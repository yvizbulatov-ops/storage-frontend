<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гость - Склад</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ===== ОСНОВНОЙ КОНТЕЙНЕР ===== */
        .guest-container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            margin: 50px auto;
            text-align: center;
        }

       /* ===== ИНФОРМАЦИЯ О ПОЛЬЗОВАТЕЛЕ ===== */
.user-info {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    padding: 12px 16px;
    background: #f8f9fa;
    border-radius: 12px;
    flex-wrap: wrap;  /* ← позволяет переноситься на телефоне */
}

.user-info .name {
    font-weight: bold;
    font-size: 18px;
}

.user-info .role {
    background: #0b57d0;
    color: white;
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 12px;
}

.btn-logout {
    background: #d93025;
    color: white;
    border: none;
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    margin-left: auto;  /* ← прижимает вправо */
    flex-shrink: 0;
    white-space: nowrap;
    text-align: center;
    transition: background 0.2s;
    width: auto;  /* ← убираем фиксированную ширину */
    max-width: 100px;
}

.btn-logout:hover {
    background: #b3261e;
}

        /* ===== ЗАГОЛОВОК ===== */
        h1 {
            color: #1a73e8;
            margin: 0 0 16px 0;
            font-size: 28px;
        }

        /* ===== КНОПКИ ДЕЙСТВИЙ ===== */
        .actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin: 24px 0;
        }

        .action-btn {
            padding: 20px 40px;
            font-size: 22px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            min-width: 140px;
            font-weight: 600;
        }

        .action-btn:hover {
            transform: scale(1.05);
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .btn-take {
            background: #0b57d0;
            color: white;
        }

        .btn-take:hover {
            background: #0842a0;
        }

        .btn-return {
            background: #1e8e3e;
            color: white;
        }

        .btn-return:hover {
            background: #166b2f;
        }

        /* ===== СООБЩЕНИЯ ===== */
        .message {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            display: none;
            font-size: 15px;
        }

        .message.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* ===== МОБИЛЬНАЯ АДАПТАЦИЯ ===== */
        @media (max-width: 480px) {
            .guest-container {
                margin: 20px auto;
                padding: 24px 20px;
                border-radius: 12px;
                width: 95%;
            }

            h1 {
                font-size: 32px;
            }

            .user-info {
                flex-wrap: wrap;
                gap: 8px;
            }

            .user-info .name {
                font-size: 20px;
            }

            .btn-logout {
                font-size: 16px;
                padding: 6px 12px;
                width: auto;
            }

            .actions {
                flex-direction: column;
                gap: 12px;
            }

            .action-btn {
                padding: 20px;
                font-size: 24px;
                min-width: unset;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="guest-container">
        <h1>🏭 Склад</h1>
        
        <!-- Информация о пользователе -->
        <div class="user-info" id="userInfo">
            <span class="name" id="userNameDisplay">Загрузка...</span>
            <span class="role" id="userRoleDisplay">Гость</span>
            <button class="btn-logout" onclick="logout()">Выйти</button>
        </div>

        <!-- Кнопки действий -->
        <div class="actions">
            <button class="action-btn btn-take" onclick="goToTake()">
                📦 Забрать
            </button>
        </div>

        <!-- Сообщение об ошибке/успехе -->
        <div id="message" class="message"></div>
    </div>

    <script src="js/0_Global.js"></script>
    <script src="js/api.js"></script>
    <script>
        // ============================================
        // СТРАНИЦА ГОСТЯ
        // ============================================

        var currentUser = null;

        // При загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            var userData = localStorage.getItem('user');
            
            if (!userData) {
                window.location.href = 'index.html';
                return;
            }

            try {
                currentUser = JSON.parse(userData);
                document.getElementById('userNameDisplay').textContent = currentUser.name;
                document.getElementById('userRoleDisplay').textContent = currentUser.role || 'Гость';
            } catch (error) {
                window.location.href = 'index.html';
            }
        });

        function goToTake() {
            window.location.href = 'take.html';
        }

        function logout() {
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
